<line x1="24" y1="272" x2="456" y2="272" stroke="#2b3439"/>
<text x="24" y="294" fill="#99a09d" font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="0.4">2× XEON 6548Y+ · 1 TiB DDR5 · 2× H100 NVL</text>
</svg>
